version: '3.8'

services:
  # 1. Aplikasi PHP & Apache (CodeIgniter 4)
  app:
    build: .
    container_name: apotek_baraya_app
    restart: always
    environment:
      CI_ENVIRONMENT: production
    ports:
      - "8088:80"
    depends_on:
      - db

  # 2. Database MySQL
  db:
    image: mysql:8.0
    container_name: apotek_baraya_db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: apotek_baraya
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 3. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: apotek_baraya_pma
    restart: always
    environment:
      PMA_HOST: db
    ports:
      - "8089:80"
    depends_on:
      - db

volumes:
  db_data:
